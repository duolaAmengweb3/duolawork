name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundles
        run: npm run build

      - name: Ensure Chrome / Playwright browser binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            if [ -x /usr/bin/google-chrome ] || [ -x /opt/google/chrome/chrome ]; then
              echo "Found system Chrome: $(command -v google-chrome || echo /opt/google/chrome/chrome)"
            else
              npx playwright install chromium --with-deps
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            if [ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
              echo "Found system Chrome on macOS runner"
            else
              npx playwright install chromium
            fi
          fi

      - name: Run automated test suite
        run: npm test
