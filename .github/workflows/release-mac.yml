name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac-dmg:
    name: Build macOS .app & .dmg
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundles
        run: npm run build

      - name: Import Apple Developer ID certificate (optional)
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/dw-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dev-id.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          rm -f "$CERT_PATH"

      - name: Package DuolaWork.app and DuolaWork.dmg
        env:
          DUOLAWORK_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          npm run package:mac
          npm run package:dmg

      - name: Clean up temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dev-id.p12"
          if [ -f "$RUNNER_TEMP/dw-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/dw-signing.keychain-db" || true
          fi

      - name: Upload DMG and SHA-256 checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: duolawork-macos-${{ runner.arch }}
          path: |
            dist/mac/DuolaWork-*.dmg
            dist/mac/DuolaWork-*.dmg.sha256
          if-no-files-found: error
