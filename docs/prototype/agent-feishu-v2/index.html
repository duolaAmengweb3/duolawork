<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Hub 2.0 · 协作空间预览</title><style>:root {
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: #1f2329;
  background: #fff;
  font-size: 14px;
  font-synthesis: none;
  --blue: #245bdb;
  --blue-soft: #eaf0ff;
  --ink: #1f2329;
  --muted: #646a73;
  --line: #e5e8ed;
  --panel: #f7f8fa;
  --green: #21745b;
  --amber: #986114;
  --purple: #7551a9;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
textarea,
select {
  font: inherit;
}
button,
a,
input,
textarea,
select {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  color: inherit;
}
button {
  background: none;
  border: 0;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.46;
}
button:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 2px solid #3972f0;
  outline-offset: 3px;
  border-radius: 5px;
}
input:focus,
textarea:focus,
select:focus {
  outline: 2px solid #c1d2fc;
  outline-offset: 0;
  border-color: #7899e8;
}
a {
  color: var(--blue);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
h1,
h2,
h3,
h4,
p {
  margin: 0;
}
svg {
  flex-shrink: 0;
}
input,
textarea,
select {
  background: #fff;
  color: var(--ink);
  border: 1px solid #d9dee6;
  border-radius: 6px;
  padding: 10px 12px;
  min-width: 0;
}
input::placeholder,
textarea::placeholder {
  color: #767e8b;
}
textarea {
  resize: vertical;
  line-height: 1.65;
}
select {
  min-height: 38px;
}
small {
  font-size: 12px;
  color: var(--muted);
}
.app-shell {
  height: 100dvh;
  min-height: 480px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.preview-bar {
  height: 29px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #f5f7fb;
  border-bottom: 1px solid var(--line);
  color: #646d7d;
  font-size: 12px;
  letter-spacing: 0.1px;
}
.preview-bar > span,
.preview-bar button {
  display: flex;
  align-items: center;
  gap: 7px;
}
.preview-bar button {
  font-size: 12px;
  color: #596779;
}
.preview-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #8294ba;
}
.preview-separator {
  margin: 0 5px;
  color: #a5acb7;
}
.app-body {
  display: flex;
  min-height: 0;
  flex: 1;
}
.global-rail {
  width: 76px;
  background: #f5f7fb;
  border-right: 1px solid var(--line);
  display: flex;
  align-items: center;
  flex-direction: column;
  flex-shrink: 0;
  padding: 21px 7px 16px;
  z-index: 10;
}
.brand {
  width: 40px;
  height: 40px;
  background: var(--blue);
  border-radius: 11px;
  color: white;
  display: grid;
  place-items: center;
  box-shadow: 0 3px 8px #245bdb1c;
}
.rail-nav {
  margin-top: 29px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}
.rail-item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border-radius: 8px;
  width: 100%;
  min-height: 63px;
  padding: 8px 0;
  color: #626d7f;
  font-size: 12px;
}
.rail-item:hover {
  background: #eaf0f8;
}
.rail-item.active {
  background: #e6edfc;
  color: var(--blue);
}
.rail-icon {
  position: relative;
  height: 23px;
}
.rail-icon i {
  position: absolute;
  right: -4px;
  top: -2px;
  width: 6px;
  height: 6px;
  background: #bc7c2e;
  border: 1px solid #f5f7fb;
  border-radius: 50%;
}
.rail-bottom {
  margin-top: auto;
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 18px;
  width: 100%;
}
.profile {
  display: grid;
  place-items: center;
  border: 1px solid #dbe1ec;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  color: #5a6b89;
  background: #e8edf6;
  font-weight: 600;
}
.project-list {
  width: 236px;
  flex-shrink: 0;
  background: #fafbfc;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 17px 12px 0;
  min-height: 0;
}
.list-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 3px 14px;
}
.list-heading h1 {
  font-size: 19px;
  letter-spacing: 0.5px;
}
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 7px;
  border-radius: 5px;
  color: #626d7b;
  flex-shrink: 0;
}
.icon-button:hover {
  background: #eef1f6;
  color: #253a5e;
}
.icon-button.active {
  background: #eaf0ff;
  color: var(--blue);
}
.search {
  height: 35px;
  border: 1px solid #e0e5ed;
  background: #f1f3f7;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  color: #757e8e;
}
.search input {
  padding: 0;
  border: 0;
  outline: 0;
  background: none;
  width: 100%;
  font-size: 13px;
  height: 100%;
}
.search:focus-within {
  outline: 2px solid #c1d2fc;
}
.list-label {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  color: #707b8d;
  padding: 23px 9px 11px;
}
.list-label > span {
  color: #727c8d;
  border-radius: 4px;
  background: #e9edf3;
  padding: 0 5px;
  line-height: 18px;
}
.list-scroll {
  flex: 1;
  overflow: auto;
  margin: 0 -3px;
  padding: 0 3px;
  scrollbar-width: thin;
}
.project-item {
  position: relative;
  border-radius: 7px;
  margin-bottom: 6px;
  padding: 2px 0 8px;
}
.project-item:hover {
  background: #f0f3f8;
}
.project-item.selected {
  background: #eaf0fc;
}
.project-item.selected:before {
  position: absolute;
  content: "";
  width: 3px;
  background: var(--blue);
  border-radius: 2px;
  left: 0;
  top: 13px;
  bottom: 13px;
}
.project-hit {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 7px;
  text-align: left;
  width: 100%;
  padding: 13px 11px 4px;
}
.project-hit strong {
  font-size: 14px;
  font-weight: 600;
  line-height: 21px;
  overflow-wrap: anywhere;
}
.project-hit small {
  grid-column: 2;
  font-size: 12px;
  line-height: 19px;
}
.project-icon {
  color: #677b9f;
  display: grid;
  place-items: center;
}
.project-item.selected .project-icon {
  color: var(--blue);
}
.project-review {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 5px 0 0 42px;
  color: var(--blue);
  font-size: 12px;
  min-height: 27px;
  padding: 0;
}
.project-review:hover {
  text-decoration: underline;
}
.new-project-link {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 14px 10px;
  color: #697486;
  font-size: 13px;
  border-top: 1px solid var(--line);
}
.sidebar-foot {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 -12px;
  padding: 17px 15px;
  border-top: 1px solid var(--line);
  text-align: left;
  min-height: 69px;
  color: #59677d;
}
.sidebar-foot > span {
  flex: 1;
  font-weight: 500;
}
.sidebar-foot small {
  display: block;
  font-weight: 400;
  font-size: 12px;
  margin-top: 5px;
}
.sidebar-foot:hover {
  background: #eef2f9;
}
.main-workspace {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: white;
}
.workspace-header {
  height: 62px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 23px;
}
.header-title {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}
.header-title h2 {
  font-size: 17px;
  line-height: 24px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
}
.project-header-icon {
  color: #3f68b0;
  display: grid;
  place-items: center;
  background: #edf2fd;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  flex-shrink: 0;
}
.member-stack {
  display: flex;
  align-items: center;
  margin-left: 7px;
  padding-left: 6px;
}
.member-stack .avatar {
  border: 2px solid #fff;
  margin-left: -6px;
  font-size: 10px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid #d8dfe9;
  border-radius: 6px;
  background: #fff;
  padding: 0 13px;
  min-height: 36px;
  line-height: 20px;
  font-weight: 500;
  white-space: nowrap;
  text-decoration: none;
  font-size: 13px;
  color: #384558;
}
.button:hover:not(:disabled) {
  background: #f6f8fc;
  border-color: #bcc9e1;
  text-decoration: none;
}
.button.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  box-shadow: 0 1px 2px #143d9420;
}
.button.primary:hover:not(:disabled) {
  background: #194bc3;
  border-color: #194bc3;
}
.button.quiet {
  border-color: transparent;
  background: none;
  color: #646f81;
  box-shadow: none;
}
.button.quiet:hover:not(:disabled) {
  background: #f1f4f9;
}
.button.small {
  min-height: 32px;
  padding: 0 11px;
  font-size: 12px;
}
.button.full {
  width: 100%;
  margin-top: 8px;
}
.button.selected {
  background: #eef3ff;
  border-color: #b9c9ef;
  color: var(--blue);
}
.button.success {
  color: #21745b;
  background: #eaf6f0;
  border-color: #c6e3d4;
}
.text-button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: var(--blue);
  min-height: 30px;
  padding: 3px 0;
}
.text-button:hover {
  text-decoration: underline;
}
.button-row {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.group-layout {
  display: flex;
  flex: 1;
  min-height: 0;
  position: relative;
}
.conversation {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
  min-height: 0;
  position: relative;
}
.goal-line {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  padding: 9px 25px;
  border-bottom: 1px solid #edf0f5;
  background: #fcfdff;
  text-align: left;
  color: #6d7889;
  font-size: 12px;
  flex-shrink: 0;
}
.goal-label {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  color: #566b90;
}
.goal-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.goal-line:hover {
  background: #f4f7fd;
}
.conversation-scroll {
  overflow: auto;
  flex: 1;
  padding: 0 26px 15px;
  scrollbar-width: thin;
  scrollbar-color: #d3dae4 transparent;
  min-height: 0;
}
.day-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  color: #798391;
  font-size: 12px;
  margin: 18px auto 23px;
}
.day-divider:before,
.day-divider:after {
  content: "";
  height: 1px;
  background: #edf0f4;
  width: 48px;
}
.message {
  display: flex;
  gap: 12px;
  margin: 0 0 23px;
  align-items: flex-start;
}
.avatar {
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0;
}
.message-main {
  min-width: 0;
  flex: 1;
  max-width: 810px;
}
.message-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  min-height: 20px;
  font-size: 12px;
  color: #707b8b;
  flex-wrap: wrap;
}
.message-meta strong {
  font-size: 13px;
  font-weight: 600;
  color: #404a5a;
}
.message-meta time {
  color: #7a8392;
  font-size: 12px;
}
.message-bubble {
  font-size: 14px;
  line-height: 1.8;
  color: #354052;
  display: inline-block;
  max-width: 100%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding: 10px 14px;
  background: #f2f4f7;
  border-radius: 0 8px 8px 8px;
}
.own .message-bubble {
  background: #edf2fe;
}
.rich-message {
  white-space: normal;
}
.rich-message p + p {
  margin-top: 6px;
}
.rich-message ul,
.rich-message ol {
  margin: 6px 0;
  padding-left: 22px;
}
.handoff {
  border: 1px solid #e1e7f0;
  border-radius: 7px;
  margin: 0 0 23px 44px;
  max-width: 810px;
  background: white;
}
.handoff summary {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  min-height: 68px;
  cursor: pointer;
  list-style: none;
}
.handoff summary::-webkit-details-marker {
  display: none;
}
.handoff summary > div:nth-child(2) {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 5px;
}
.handoff summary strong {
  font-size: 13px;
  font-weight: 600;
}
.handoff summary span {
  font-size: 12px;
  color: #647693;
}
.handoff summary > svg {
  color: #7a8698;
}
.handoff-avatars {
  display: flex;
  align-items: center;
  gap: 3px;
  color: #8090a7;
}
.handoff p {
  padding: 0 15px 14px;
  font-size: 13px;
  color: #637087;
  line-height: 1.7;
}
.handoff[open] summary > svg {
  transform: rotate(90deg);
}
.delivery-card {
  border: 1px solid #dbe3f1;
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
  margin-top: 1px;
}
.delivery-card header {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 17px 17px 10px;
}
.document-symbol {
  width: 34px;
  height: 38px;
  border-radius: 6px;
  background: #edf2ff;
  color: var(--blue);
  display: grid;
  place-items: center;
}
.delivery-card header strong {
  display: block;
  font-size: 14px;
  line-height: 22px;
}
.delivery-card header span:not(.document-symbol) {
  display: block;
  font-size: 12px;
  color: #737e8f;
  margin-top: 3px;
}
.delivery-list {
  padding: 2px 16px 8px;
}
.delivery-list button {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 39px;
  text-align: left;
  width: 100%;
  padding: 6px 3px;
  border-radius: 5px;
}
.delivery-list button:hover {
  background: #f5f7fb;
}
.delivery-list span {
  background: #f0f3f9;
  font-size: 12px;
  padding: 3px 5px;
  border-radius: 4px;
  color: #6e7d95;
}
.delivery-list strong {
  font-weight: 500;
  font-size: 13px;
  flex: 1;
  line-height: 22px;
}
.delivery-list svg {
  color: #7b8ca8;
}
.delivery-card footer {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 17px 16px;
}
.composer-wrap {
  padding: 10px 22px 17px;
  background: white;
  flex-shrink: 0;
}
.composer {
  border: 1px solid #d4dce8;
  border-radius: 8px;
  box-shadow: 0 1px 3px #14244205;
  background: white;
}
.composer:focus-within {
  border-color: #8aa7e8;
  box-shadow: 0 0 0 2px #245bdb09;
}
.composer .tiptap {
  min-height: 52px;
  max-height: 150px;
  overflow: auto;
  outline: 0;
  padding: 14px 14px 7px;
  font-size: 14px;
  line-height: 1.6;
}
.composer .tiptap p {
  margin: 0;
}
.composer .tiptap p.is-empty:first-child:before {
  content: attr(data-placeholder);
  color: #818a99;
  float: left;
  height: 0;
  pointer-events: none;
}
.composer .tiptap:has(p:only-child:empty):before {
  content: attr(data-placeholder);
  color: #818a99;
  pointer-events: none;
  position: absolute;
}
.composer-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 9px 9px;
  gap: 8px;
}
.composer-tools > div {
  display: flex;
  align-items: center;
  gap: 5px;
}
.recipient-select {
  display: flex;
  align-items: center;
  color: #6d788a;
  gap: 4px;
}
.recipient-select select {
  border: 0;
  min-height: 30px;
  padding: 0 4px;
  font-size: 12px;
  background: transparent;
  max-width: 125px;
  color: #65738a;
}
.keyboard-hint {
  font-size: 12px;
  color: #7a8494;
  margin-right: 8px;
}
.send-button {
  height: 32px;
  width: 36px;
  background: var(--blue);
  color: white;
  display: grid;
  place-items: center;
  border-radius: 6px;
}
.send-button:disabled {
  background: #d9e2f5;
  opacity: 1;
  color: #788cab;
}
.recipient-strip {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 10px 12px 0;
  font-size: 12px;
  color: var(--blue);
}
.recipient-strip button {
  display: grid;
  place-items: center;
  margin-left: 5px;
  width: 22px;
  height: 22px;
}
.composer-format {
  display: flex;
  gap: 3px;
  padding: 6px 10px 0;
}
.overview {
  width: 316px;
  flex-shrink: 0;
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: #fff;
}
.overview-tabs {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 0 16px;
  min-height: 50px;
  border-bottom: 1px solid var(--line);
}
.overview-tabs [role="tablist"] {
  display: flex;
  height: 50px;
  gap: 20px;
  align-items: stretch;
}
.overview-tabs [role="tab"] {
  position: relative;
  font-size: 13px;
  color: #657184;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 5px;
}
.overview-tabs [role="tab"].selected {
  color: var(--blue);
  font-weight: 600;
}
.overview-tabs [role="tab"].selected:after {
  content: "";
  position: absolute;
  bottom: 0;
  height: 2px;
  background: var(--blue);
  left: 0;
  right: 0;
  border-radius: 2px;
}
.overview-tabs [role="tab"] span {
  font-size: 11px;
  background: #edf2ff;
  color: var(--blue);
  padding: 1px 4px;
  border-radius: 4px;
}
.overview-scroll {
  overflow: auto;
  flex: 1;
  scrollbar-width: thin;
}
.results-list {
  padding: 15px 11px;
}
.result-item {
  display: flex;
  width: 100%;
  gap: 10px;
  align-items: flex-start;
  text-align: left;
  padding: 14px 10px;
  border-radius: 7px;
  color: #6e7c91;
  margin-bottom: 6px;
}
.result-item.selected {
  background: #eef3fe;
  color: var(--blue);
}
.result-item:hover {
  background: #f3f6fc;

/* Forms and dialogs share the same design language. */
.modal {
  border: 1px solid #e1e6ef;
  border-radius: 12px;
  width: min(560px, calc(100vw - 50px));
  max-height: calc(100dvh - 64px);
  padding: 0;
  box-shadow: 0 24px 80px #253b6229;
  color: var(--ink);
  background: #fff;
  overflow: hidden;
}
.modal.wide {
  width: min(890px, calc(100vw - 60px));
}
.modal::backdrop {
  background: #26344a42;
  backdrop-filter: blur(3px);
}
.modal[open] {
  display: flex;
  flex-direction: column;
}
.modal > header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 23px 27px 20px;
  border-bottom: 1px solid var(--line);
  gap: 15px;
  flex-shrink: 0;
}
.modal h2 {
  font-size: 20px;
  line-height: 1.4;
  font-weight: 600;
}
.modal > header p {
  font-size: 13px;
  color: #7b879a;
  line-height: 1.8;
  margin-top: 7px;
}
.modal-body {
  padding: 23px 27px 25px;
  overflow: auto;
  min-height: 0;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 20px;
  font-size: 13px;
  font-weight: 500;
  color: #465672;
}
.field input,
.field textarea,
.field select {
  font-weight: 400;
  font-size: 14px;
}
.form-row {
  display: flex;
  gap: 18px;
  align-items: flex-start;
}
.grow {
  flex: 1;
  min-width: 0;
}
.template-toggle {

}
.template-options {

  gap: 8px;
  flex-wrap: wrap;
  margin: -4px 0 21px;
}
.template-options button {
  border: 1px solid #d9e4f5;
  background: #f4f8ff;
  display: flex;

  border-radius: 5px;
  font-size: 12px;

.project-form fieldset {

}

  font-size: 13px;

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
.composer.is-empty .tiptap:before {
  content: attr(data-placeholder);
  position: absolute;
  color: #7b8595;
  pointer-events: none;
}
.rule-main .card-meta {
  flex-wrap: wrap;
}
.assignment-row {
  display: grid;
  grid-template-columns: 115px minmax(0, 1fr) 235px;
  align-items: center;
  gap: 16px;
  padding: 16px 0;
  border-top: 1px solid var(--line);
}
.assignment-member {
  display: flex;
  align-items: center;
  gap: 8px;
}
.assignment-row .field {
  margin: 0;
}
.assignment-row .field select {
  width: 100%;
}
@media (max-width: 1000px) {
  .assignment-row {
    grid-template-columns: 90px minmax(0, 1fr);
  }
  .assignment-row .field:last-child {
    grid-column: 2;
  }
}
/* Review-aligned collaboration: a goal wizard and decisions inside the artifact. */
.wizard-steps {
  display: flex;
  gap: 30px;
  padding-bottom: 28px;
  color: var(--muted);
}
.wizard-steps span {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.wizard-steps b {
  display: grid;
  place-items: center;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: #eff2f7;
  font-weight: 500;
}
.wizard-steps .current {
  color: var(--blue);
  font-weight: 600;
}
.wizard-steps .current b {
  background: #e9efff;
}
.goal-field textarea {
  font-size: 17px;
  line-height: 1.8;
  min-height: 190px;
}
.wizard .form-actions {
  padding-top: 24px;
}
.wizard-goal {
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 24px;
}
.three-modes {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.three-modes .mode-option {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  position: relative;
  padding: 20px 16px;
  min-height: 162px;
}
.three-modes .mode-option strong {
  display: flex;
  gap: 8px;
  align-items: center;
}
.three-modes .radio-dot {
  position: absolute;
  right: 14px;
  top: 22px;
}
.three-modes .mode-option small {
  line-height: 1.7;
  display: block;
  margin-top: 9px;
}
.wizard .member-choice small {
  display: block;
  font-size: 12px;
  color: #626f84;
  margin-top: 4px;
}
.wizard .member-choice {
  padding: 12px;
}
.wizard-summary {
  padding: 20px;
  border: 1px solid var(--line);
  background: #f8faff;
  border-radius: 8px;
  margin-bottom: 24px;
}
.wizard-summary strong {
  font-size: 17px;
  line-height: 1.8;
}
.wizard-summary p {
  margin-top: 8px;
  color: var(--muted);
}
.cadence-options {
  display: flex;
  gap: 24px;
  padding: 10px 0 24px;
}
.cadence-options label {
  display: flex;
  gap: 8px;
  align-items: center;
}
.phase-summary {
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  min-height: 54px;
  border-bottom: 1px solid var(--line);
  background: #fafbfd;
  font-size: 12px;
}
.phase-summary span {
  display: flex;
  gap: 12px;
  align-items: center;
}
.phase-summary strong {
  font-size: 13px;
}
.phase-summary small {
  font-size: 12px;
  color: var(--muted);
}
.phase-summary button {
  color: var(--blue);
  white-space: nowrap;
}
.evidence-drawer h3 {
  font-size: 16px;
  margin-bottom: 12px;
}
.evidence-drawer section {
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  line-height: 1.8;
}
.evidence-drawer section > .avatar {
  vertical-align: middle;
  margin-right: 8px;
}
.evidence-drawer .badge {
  display: table;
  margin-top: 12px;
}
.decision-inline {
  background: #fff8eb;
  border: 1px solid #e5c78b;
  border-radius: 8px;
  padding: 22px;
  margin: 26px 0;
  line-height: 1.7;
  font-size: 14px;
}
.decision-inline h3 {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 16px !important;
  margin: 0 0 12px !important;
  color: #77500f;
}
.decision-inline p {
  font-size: 14px !important;
  margin: 8px 0 13px !important;
  line-height: 1.7 !important;
}
.decision-inline .decision-description {
  color: #6b5c43;
}
.decision-positions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.decision-positions section {
  min-width: 0;
  background: #fffdf8;
  border: 1px solid #eadcc4;
  border-radius: 6px;
  padding: 14px;
}
.decision-positions header {
  display: flex;
  gap: 8px;
  align-items: center;
}
.decision-positions details {
  font-size: 12px;
  margin: 10px 0;
}
.decision-positions summary {
  cursor: pointer;
  color: #765b2f;
}
.decision-positions details p {
  font-size: 12px !important;
}
.decision-recommendation {
  color: #6b5c43;
}
.decision-alternatives {
  display: flex;
  gap: 18px;
  margin-top: 16px;
}
.decision-alternatives button,
.decision-undo button,
.learning-note button.text-button {
  color: var(--blue);
  font-size: 13px;
}
.remember-choice {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
  font-size: 12px;
  color: #6b5c43;
}
.decision-inline.resolved {
  padding: 0;
  background: transparent;
  border: 0;
}
.decision-inline .decision-chosen {
  font-size: 16px !important;
  animation: decision-highlight 3s ease-out;
}
.decision-undo {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
}
.decision-undo button {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.decision-writing textarea {
  width: 100%;
  margin: 10px 0;
}
.decision-writing .button {
  margin-right: 8px;
}
.learning-note {
  background: #f5f8ff;
  border: 1px solid #dce5f7;
  border-radius: 8px;
  padding: 16px;
  font-size: 13px;
  line-height: 1.8;
  max-width: 260px;
}
.learning-note > p {
  margin: 10px 0;
}
.learning-note > strong {
  font-size: 14px;
  display: block;
  margin-bottom: 16px;
}
.learning-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.learning-accepted {
  color: #277668;
}
.learning-accepted button {
  color: var(--blue);
  margin-left: 8px;
}
.learning-demo {
  margin-top: 20px;
}
@keyframes decision-highlight {
  from {
    background: #fff0c8;
  }
  to {
    background: transparent;
  }
}
@media (max-width: 1100px) {
  .decision-positions {
    grid-template-columns: 1fr;
  }
  .phase-summary {
    flex-wrap: wrap;
    padding: 10px 18px;
  }
  .phase-summary span {
    gap: 8px;
  }
}
@media (max-width: 700px) {
  .three-modes {
    grid-template-columns: 1fr;
  }
  .three-modes .mode-option {
    min-height: auto;
  }
  .wizard-steps {
    gap: 12px;
  }
}
