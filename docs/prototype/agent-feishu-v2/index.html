/* Forms and dialogs share the same design language. */
.modal {
  border: 1px solid #e1e6ef;
  border-radius: 12px;
  width: min(560px, calc(100vw - 50px));
  max-height: calc(100dvh - 64px);
  padding: 0;
  box-shadow: 0 24px 80px #253b6229;
  color: var(--ink);
  background: #fff;
  overflow: hidden;
}
.modal.wide {
  width: min(890px, calc(100vw - 60px));
}
.modal::backdrop {
  background: #26344a42;
  backdrop-filter: blur(3px);
}
.modal[open] {
  display: flex;
  flex-direction: column;
}
.modal > header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 23px 27px 20px;
  border-bottom: 1px solid var(--line);
  gap: 15px;
  flex-shrink: 0;
}
.modal h2 {
  font-size: 20px;
  line-height: 1.4;
  font-weight: 600;
}
.modal > header p {
  font-size: 14px;
  color: #7b879a;
  line-height: 1.8;
  margin-top: 7px;
}
.modal-body {
  padding: 23px 27px 25px;
  overflow: auto;
  min-height: 0;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 20px;
  font-size: 14px;
  font-weight: 500;
  color: #465672;
}
.field input,
.field textarea,
.field select {
  font-weight: 400;
  font-size: 14px;
}
.form-row {
  display: flex;
  gap: 18px;
  align-items: flex-start;
}
.grow {
  flex: 1;
  min-width: 0;
}
.template-toggle {

}
.template-options {

  gap: 8px;
  flex-wrap: wrap;
  margin: -4px 0 21px;
}
.template-options button {
  border: 1px solid #d9e4f5;
  background: #f4f8ff;
  display: flex;

  border-radius: 5px;
  font-size: 12px;

.project-form fieldset {

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
.composer.is-empty .tiptap:before {
  content: attr(data-placeholder);
  position: absolute;
  color: #7b8595;
  pointer-events: none;
}
.rule-main .card-meta {
  flex-wrap: wrap;
}
.assignment-row {
  display: grid;
  grid-template-columns: 115px minmax(0, 1fr) 235px;
  align-items: center;
  gap: 16px;
  padding: 16px 0;
  border-top: 1px solid var(--line);
}
.assignment-member {
  display: flex;
  align-items: center;
  gap: 8px;
}
.assignment-row .field {
  margin: 0;
}
.assignment-row .field select {
  width: 100%;
}
@media (max-width: 1000px) {
  .assignment-row {
    grid-template-columns: 90px minmax(0, 1fr);
  }
  .assignment-row .field:last-child {
    grid-column: 2;
  }
}
/* Review-aligned collaboration: a goal wizard and decisions inside the artifact. */
.wizard-steps {
  display: flex;
  gap: 30px;
  padding-bottom: 28px;
  color: var(--muted);
}
.wizard-steps span {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}
.wizard-steps b {
  display: grid;
  place-items: center;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: #eff2f7;
  font-weight: 500;
}
.wizard-steps .current {
  color: var(--blue);
  font-weight: 600;
}
.wizard-steps .current b {
  background: #e9efff;
}
.goal-field textarea {
  font-size: 17px;
  line-height: 1.8;
  min-height: 190px;
}
.wizard .form-actions {
  padding-top: 24px;
}
.wizard-goal {
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 24px;
}
.three-modes {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.three-modes .mode-option {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  position: relative;
  padding: 20px 16px;
  min-height: 162px;
}
.three-modes .mode-option strong {
  display: flex;
  gap: 8px;
  align-items: center;
}
.three-modes .radio-dot {
  position: absolute;
  right: 14px;
  top: 22px;
}
.three-modes .mode-option small {
  line-height: 1.7;
  display: block;
  margin-top: 9px;
}
.wizard .member-choice small {
  display: block;
  font-size: 12px;
  color: #626f84;
  margin-top: 4px;
}
.wizard .member-choice {
  padding: 12px;
}
.wizard-summary {
  padding: 20px;
  border: 1px solid var(--line);
  background: #f8faff;
  border-radius: 8px;
  margin-bottom: 24px;
}
.wizard-summary strong {
  font-size: 17px;
  line-height: 1.8;
}
.wizard-summary p {
  margin-top: 8px;
  color: var(--muted);
}
.cadence-options {
  display: flex;
  gap: 24px;
  padding: 10px 0 24px;
}
.cadence-options label {
  display: flex;
  gap: 8px;
  align-items: center;
}
.phase-summary {
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  min-height: 54px;
  border-bottom: 1px solid var(--line);
  background: #fafbfd;
  font-size: 12px;
}
.phase-summary span {
  display: flex;
  gap: 12px;
  align-items: center;
}
.phase-summary strong {
  font-size: 14px;
}
.phase-summary small {
  font-size: 12px;
  color: var(--muted);
}
.phase-summary button {
  color: var(--blue);
  white-space: nowrap;
}
.evidence-drawer h3 {
  font-size: 16px;
  margin-bottom: 12px;
}
.evidence-drawer section {
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  line-height: 1.8;
}
.evidence-drawer section > .avatar {
  vertical-align: middle;
  margin-right: 8px;
}
.evidence-drawer .badge {
  display: table;
  margin-top: 12px;
}
.decision-inline {
  background: #fff8eb;
  border: 1px solid #e5c78b;
  border-radius: 8px;
  padding: 22px;
  margin: 26px 0;
  line-height: 1.7;
  font-size: 14px;
}
.decision-inline h3 {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 16px !important;
  margin: 0 0 12px !important;
  color: #77500f;
}
.decision-inline p {
  font-size: 14px !important;
  margin: 8px 0 13px !important;
  line-height: 1.7 !important;
}
.decision-inline .decision-description {
  color: #6b5c43;
}
.decision-positions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.decision-positions section {
  min-width: 0;
  background: #fffdf8;
  border: 1px solid #eadcc4;
  border-radius: 6px;
  padding: 14px;
}
.decision-positions header {
  display: flex;
  gap: 8px;
  align-items: center;
}
.decision-positions details {
  font-size: 12px;
  margin: 10px 0;
}
.decision-positions summary {
  cursor: pointer;
  color: #765b2f;
}
.decision-positions details p {
  font-size: 12px !important;
}
.decision-recommendation {
  color: #6b5c43;
}
.decision-alternatives {
  display: flex;
  gap: 18px;
  margin-top: 16px;
}
.decision-alternatives button,
.decision-undo button,
.learning-note button.text-button {
  color: var(--blue);
  font-size: 14px;
}
.remember-choice {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
  font-size: 12px;
  color: #6b5c43;
}
.decision-inline.resolved {
  padding: 0;
  background: transparent;
  border: 0;
}
.decision-inline .decision-chosen {
  font-size: 16px !important;
  animation: decision-highlight 3s ease-out;
}
.decision-undo {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
}
.decision-undo button {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.decision-writing textarea {
  width: 100%;
  margin: 10px 0;
}
.decision-writing .button {
  margin-right: 8px;
}
.learning-note {
  background: #f5f8ff;
  border: 1px solid #dce5f7;
  border-radius: 8px;
  padding: 16px;
  font-size: 14px;
  line-height: 1.8;
  max-width: 260px;
}
.learning-note > p {
  margin: 10px 0;
}
.learning-note > strong {
  font-size: 14px;
  display: block;
  margin-bottom: 16px;
}
.learning-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.learning-accepted {
  color: #277668;
}
.learning-accepted button {
  color: var(--blue);
  margin-left: 8px;
}
.learning-demo {
  margin-top: 20px;
}
@keyframes decision-highlight {
  from {
    background: #fff0c8;
  }
  to {
    background: transparent;
  }
}
@media (max-width: 1100px) {
  .decision-positions {
    grid-template-columns: 1fr;
  }
  .phase-summary {
    flex-wrap: wrap;
    padding: 10px 18px;
  }
  .phase-summary span {
    gap: 8px;
  }
}
@media (max-width: 700px) {
  .three-modes {
    grid-template-columns: 1fr;
  }
  .three-modes .mode-option {
    min-height: auto;
  }
  .wizard-steps {
    gap: 12px;
  }
}
/* v1 review: compact controls, readable artifacts, explicit demo states */
.v1-form .three-modes {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.v1-form .mode-option {
  min-height: 0;
  padding: 11px 14px;
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}
.v1-form .mode-option strong {
  font-size: 14px;
}
.v1-form .mode-option > span:not(.radio-dot) {
  flex: 1;
  text-align: left;
  display: block;
}
.v1-form .mode-option .radio-dot {
  flex: 0 0 14px;
  position: static;
}
.v1-form .mode-option small {
  margin-top: 3px;
  line-height: 1.5;
}
.v1-form .form-actions {
  position: sticky;
  bottom: -24px;
  z-index: 5;
  background: #fff;
  padding: 14px 0 8px;
  border-top: 1px solid var(--line);
}
.v1-form fieldset {
  margin-top: 16px;
}
.v1-form .wizard-goal {
  margin-bottom: 14px;
}
.v1-form .v1-output-preview {
  margin-top: 12px;
}
.v1-review-record {
  margin: 14px 0 24px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  line-height: 1.7;
}
.v1-review-record.compact {
  margin: 10px 0;
  padding: 9px 0;
}
.v1-check-trigger {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 14px;
  font-weight: 600;
  color: #245bdb;
  padding: 0;
}
.incomplete,
.v1-check-trigger.incomplete {
  color: #b43c39;
}
.v1-record-line {
  display: block;
  text-align: left;
  margin-top: 6px;
  padding: 0;
  color: #5b6677;
  font-size: 12px;
  line-height: 1.9;
}
.v1-record-line span {
  color: var(--blue);
  white-space: nowrap;
  margin-left: 5px;
}
.v1-check-list {
  margin-top: 12px;
  padding: 15px;
  background: #f6f8fc;
  border-radius: 6px;
  color: #445168;
}
.v1-check-list section {
  padding: 10px 0;
  border-bottom: 1px solid #e4e9f0;
}
.v1-check-list section:last-child {
  border-bottom: 0;
}
.v1-check-list p {
  font-size: 12px;
  margin: 5px 0;
  line-height: 1.7;
}
.v1-document-title {
  margin: 22px 0 12px;
  font-size: 29px;
  letter-spacing: -0.7px;
  line-height: 1.4;
}
.document-paper .tiptap > h1:first-child,
.document-paper .safe-content > h1:first-child,
.document-paper .original-document > h1:first-child {
  display: none;
}
.document-workspace {
  position: relative;
}
.format-bar {
  display: none;
}
.format-bar.v1-format-visible {
  display: flex;
  position: absolute;
  z-index: 15;
  top: 70px;
  left: 40px;
  width: fit-content;
  border: 1px solid var(--line);
  box-shadow: 0 5px 20px #16345b15;
  border-radius: 8px;
  background: #fff;
}
.v1-form {
  max-width: 790px;
  margin: auto;
}
.v1-delivery-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.v1-delivery-options label {
  border: 1px solid #dbe2ed;
  border-radius: 7px;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.v1-delivery-options label:has(input:checked) {
  border-color: #5684ed;
  background: #f3f7ff;
}
.v1-output-preview {
  padding: 12px 16px;
  background: #f4f7fc;
  border-left: 3px solid #b3c7fa;
  color: #52637e;
}
.v1-add-material {
  display: flex;
  gap: 10px;
  align-items: end;
}
.v1-add-material label:first-child {
  flex: 1;
  display: grid;
  gap: 6px;
}
.v1-inline-note {
  padding: 13px 15px;
  border: 1px solid #dce5f4;
  border-radius: 7px;
  background: #f5f8ff;
  color: #52637e;
  font-size: 14px;
  line-height: 1.75;
  margin: 12px 0;
}
.v1-connect-instructions {
  padding: 20px 0;
  line-height: 1.8;
}
.v1-connect-instructions p {
  margin: 12px 0;
}
.v1-connect-instructions pre {
  white-space: pre-wrap;
  padding: 18px;
  background: #f5f7fa;
  font-size: 14px;
  line-height: 1.7;
  border-radius: 6px;
}
.v1-connect-tests {
  display: grid;
  gap: 12px;
  padding: 20px 0;
}
.v1-connect-tests .button {
  justify-content: flex-start;
}
.v1-boundary {
  margin: 24px 0;
}
.v1-comparison {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}
.v1-comparison > header {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
}
.v1-comparison > header h2 {
  font-size: 19px;
}
.v1-comparison > header p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
.v1-compare-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 22px;
  background: #fafbfd;
}
.v1-compare-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.v1-compare-columns > article {
  padding: 20px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  min-width: 0;
}
.v1-compare-author {
  display: flex;
  align-items: center;
  gap: 8px;
}
.v1-compare-author > span:last-child {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
}
.v1-compare-section {
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.v1-compare-section.adopted {
  background: #f1f5ff;
}
.v1-compare-section h3 {
  font-size: 14px;
  margin-bottom: 10px;
}
.v1-compare-section p {
  font-size: 14px;
  line-height: 1.9;
}
.v1-compare-section > div {
  display: flex;
  justify-content: space-between;
  gap: 5px;
  margin-top: 10px;
  align-items: center;
}
.v1-working-draft {
  margin-top: 18px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}
.v1-working-draft header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
.v1-working-draft header span {
  font-size: 12px;
  color: #66778d;
}
.v1-working-draft .tiptap {
  min-height: 130px;
  line-height: 1.9;
  outline: none;
  padding: 12px;
  border: 1px solid #edf0f5;
  border-radius: 5px;
}
.v1-working-draft .tiptap p {
  margin-bottom: 10px;
}
.v1-scenario {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  align-items: center;
  padding: 10px 24px;
  background: #fafbfe;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.v1-scenario label {
  display: flex;
  gap: 8px;
  align-items: center;
  color: #66748a;
}
.v1-scenario select {
  min-height: 30px;
  padding: 5px 8px;
  font-size: 12px;
}
.v1-failure {
  width: 100%;
  padding: 12px;
  background: #fff6e6;
  border: 1px solid #e8cc8d;
  border-radius: 6px;
  line-height: 1.8;
}
.v1-failure > div {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 8px;
}
.v1-failure button {
  color: #805a15;
  text-decoration: underline;
  font-size: 12px;
}
.v1-result-filters {
  margin: 0 0 15px;
  color: var(--muted);
  font-size: 12px;
}
.v1-result-filters select {
  padding: 5px;
  min-height: 30px;
  font-size: 12px;
}
.v1-table-head,
.v1-result-row {
  display: grid;
  grid-template-columns:
    minmax(220px, 2.1fr) minmax(150px, 1.3fr)
    105px 95px 110px;
  gap: 14px;
  align-items: center;
}
.v1-results-table {
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: auto;
}
.v1-table-head {
  padding: 12px 18px;
  background: #f7f9fc;
  color: #66748a;
  font-size: 12px;
  min-width: 780px;
}
.v1-result-row {
  padding: 20px 18px;
  border-top: 1px solid var(--line);
  min-width: 780px;
  font-size: 14px;
}
.v1-result-row > button:first-child {
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: left;
}
.v1-result-row > span {
  display: grid;
  gap: 6px;
}
.v1-result-row .text-button {
  font-size: 12px;
  display: flex;
  gap: 4px;
}
.v1-rules-table {
  display: grid;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.v1-rule-row {
  padding: 20px;
  border-bottom: 1px solid var(--line);
}
.v1-rule-row:last-child {
  border-bottom: 0;
}
.v1-rule-row.pending {
  background: #fffaf0;
  border-left: 3px solid #e5b95c;
}
.v1-rule-summary {
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 14px;
}
.v1-rule-summary strong {
  flex: 1;
  min-width: 180px;
}
.v1-rule-row > p {
  font-size: 14px;
  line-height: 1.8;
  margin: 10px 0;
}
.v1-rule-actions {
  display: flex;
  gap: 15px;
  align-items: center;
  margin-top: 13px;
}
.v1-rule-actions select {
  font-size: 12px;
  padding: 5px;
  min-height: 30px;
}
.v1-reference-list {
  display: grid;
  gap: 8px;
}
.v1-reference-list button {
  display: flex;
  justify-content: space-between;
}
.v1-reference-list small {
  display: block;
}
.badge.red {
  color: #a53231;
  background: #fff1f0;
}
.handoff summary {
  padding-top: 9px;
  padding-bottom: 9px;
}
.delivery-card .v1-review-record {
  margin: 10px 0;
  padding: 12px 16px;
}
@media (max-width: 1100px) {
  .v1-table-head,
  .v1-result-row {
    grid-template-columns: minmax(200px, 2fr) 150px 100px 90px 100px;
  }
  .v1-compare-columns {
    gap: 10px;
  }
  .v1-compare-columns > article {
    padding: 14px;
  }
  .v1-compare-scroll {
    padding: 14px;
  }
}

/* PR #18 follow-up: one source for pending decisions, neutral edit history. */
.v1-check-trigger.historical {
  color: var(--muted);
  font-weight: 400;
}
.v1-recheck-action {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 5px;
}
.v1-recheck-action small {
  font-size: 12px;
}
.v1-criterion-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.v1-criterion-row input {
  flex: 1;
  min-width: 0;
}
.v1-form .mode-option {
  justify-content: flex-start;
  text-align: left;
}
.v1-form .radio-dot {
  margin-top: 0;
}
.workspace-header {
  height: 56px;
  gap: 10px;
  padding: 0 18px;
}
.header-title {
  flex: 1;
  gap: 10px;
}
.header-title h2 {
  flex: 0 1 auto;
  min-width: 60px;
}
.v1-header-mode {
  font-size: 14px;
  padding: 5px 0;
  color: #566b90;
  white-space: nowrap;
}
.v1-header-status {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.v1-header-pending {
  white-space: nowrap;
}
.header-actions {
  gap: 6px;
}
.handoff {
  border: 0;
  border-radius: 0;
  margin: 0 0 16px 44px;
  background: none;
}
.handoff summary {
  padding: 4px 0;
  gap: 8px;
  min-height: 28px;
}
.handoff summary strong {
  font-size: 14px;
  font-weight: 400;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.handoff summary .handoff-view {
  font-size: 14px;
  color: var(--blue);
  white-space: nowrap;
}
.handoff summary .handoff-avatars {
  display: flex;
  flex: none;
  flex-direction: row;
  gap: 3px;
}
.handoff p {
  padding: 8px 0 0 60px;
}
.document-scroll {
  overflow-anchor: none;
}
.v1-reading-buffer {
  height: 0;
  flex-shrink: 0;
}
/* Controls and list text are readable; captions are allowed at 12px. */
.button.small,
.text-button,
.rail-item,
.project-review,
.badge,
.v1-record-line,
.project-form legend,
.member-choice,
.v1-scenario select,
.v1-failure button,
.v1-result-filters,
.v1-result-filters select,
.v1-table-head,
.v1-result-row .text-button,
.v1-rule-actions select,
.v1-check-list p,
.v1-check-trigger {
  font-size: 14px;
}
