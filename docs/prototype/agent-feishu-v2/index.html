  max-width: 80vw;
  line-height: 1.7;
}
.storage-alert {
  background: #fff0ec;
  color: #b05b49;
  font-size: 11px;
  padding: 8px 20px;
}
.no-results {
  padding: 20px;
  color: #98a5b8;
  font-size: 11px;
}
@media (min-width: 1700px) {
  .project-sidebar {
    width: 268px;
  }
  .document-pane {
    width: 46%;
  }
  .message-scroll {
    padding-left: 35px;
    padding-right: 35px;
  }
  .message-card,
  .delivery-card {
    max-width: 560px;
  }
  .document-paper {
    padding: 35px 48px;
  }
  .tiptap {
    font-size: 14px;
  }
  .message-body > p {
    font-size: 13px;
  }
}
@media (max-width: 1200px) {
  .project-sidebar {
    width: 210px;
  }
  .document-pane {
    width: 44%;
    min-width: 360px;
  }
  .message-scroll {
    padding: 0 17px 15px;
  }
  .group-heading {
    padding: 0 16px;
  }
  .group-actions {
    gap: 3px;
  }
  .project-note {
    font-size: 9px;
    text-align: center;
    line-height: 1.6;
  }
  .handoff-detail {
    display: none;
  }
  .document-paper {
    padding: 24px;
  }
  .format-mode {
    display: none;
  }
  .delivery-card footer > span {
    display: none;
  }
  .document-meta {
    gap: 7px;
    padding-left: 14px;
    padding-right: 14px;
  }
  .doc-version-strip > span {
    display: none;
  }
  .doc-version-strip {
    justify-content: flex-end;
  }
  .recipe-feature {
    grid-template-columns: 1fr 1fr;
  }
  .full-page {
    padding: 32px;
  }
  .review-mode .document-paper {
    padding: 32px 40px;
  }
  .review-context {
    width: 220px;
  }
}
@media (max-width: 950px) {
  .global-dock {
    width: 58px;
  }
  .project-sidebar {
    width: 185px;
  }
  .project-item-copy strong {
    font-size: 11px;
  }
  .project-item {
    padding: 12px 7px;
    gap: 7px;
  }
  .project-icon {
    width: 29px;
    height: 31px;
  }
  .work-area:not(.pane-closed):not(.review-mode) .conversation {
    display: none;
  }
  .document-pane {
    width: 100%;
    max-width: none;
    min-width: 0;
    border-left: 0;
  }
  .pane-tabs {
    padding-left: 20px;
  }
  .document-paper {
    max-width: 760px;
    padding: 30px 40px;
  }
  .tiptap {
    font-size: 14px;
  }
  .group-title > span {
    font-size: 9px;
  }
  .group-actions .icon-button {
    display: none;
  }
  .group-actions .icon-button[aria-label*="资料面板"] {
    display: flex;
  }
  .review-context {
    width: 190px;
  }
  .full-page {
    padding: 25px;
  }
  .preview-drafts {
    gap: 15px;
  }
  .recipe-main,
  .recipe-flow {
    padding: 23px;
  }
  .recipe-output {
    gap: 5px;
    font-size: 10px;
  }
  .recipe-output i {
    margin: 0 4px;
  }
  .window-bar {
    padding: 0 14px;
  }
  .prototype-badge {
    font-size: 9px;
  }
  .window-bar .text-button {
    display: none;
  }
}
@media (max-width: 700px) {
  .project-sidebar {
    width: 148px;
  }
  .project-search {
    margin: 0 9px 15px;
  }
  .project-item time,
  .project-icon,
  .sidebar-recipe,
  .window-app,
  .window-divider {
    display: none;
  }
  .project-item-copy strong {
    padding: 0;
  }
  .list-heading {
    padding: 18px 12px;
  }
  .list-heading h1 {
    font-size: 16px;
  }
  .window-bar {
    gap: 7px;
  }
  .prototype-badge {
    font-size: 8px;
  }
  .group-heading {
    height: 68px;
    gap: 7px;
    padding: 0 12px;
  }
  .group-title h2 {
    font-size: 14px;
  }
  .group-icon {
    display: none;
  }
  .group-actions .button {
    font-size: 9px;
    padding: 5px;
  }
  .group-title > span {
    display: none;
  }
  .document-paper {
    padding: 25px;
  }
  .review-bottom {
    padding: 12px;
  }
  .review-context {
    display: none;
  }
  .review-mode .document-paper {
    padding: 28px;
  }
  .review-mode .tiptap h1 {
    font-size: 25px;
  }
  .recipe-feature {
    grid-template-columns: 1fr;
  }
  .recipe-flow {
    border-top: 1px solid #e5eaf3;
    border-left: 0;
  }
  .preview-drafts {
    grid-template-columns: 1fr;
  }
  .recipe-footer > span:last-child {
    display: none;
  }
  .full-page {
    padding: 24px 20px;
  }
  .page-heading h1 {
    font-size: 23px;
  }
  .table-head,
  .table-row {
    grid-template-columns: 1.5fr 1fr 45px;
    gap: 9px;
  }
  .table-head > span:nth-child(3),
  .table-row > span:nth-child(3) {
    display: none;
  }
  .table-row {
    padding: 16px 5px;
    font-size: 10px;
  }
  .document-meta .text-button {
    font-size: 8px;
  }
  .doc-breadcrumb {
    padding-left: 14px;
  }
  .learning-rule p,
  .edit-feedback > span {
    display: none;
  }
  .document-meta {
    padding-bottom: 6px;
  }
  .dialog-content {
    padding: 20px;
  }
  .adopt-row strong {
    font-size: 10px;
  }
  .adopt-row small {
    font-size: 8px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
.message-body > p {
  font-size: 13px;
}
.card-copy {
  font-size: 13px;
}
.card-copy p {
  font-size: 12px;
  color: #697589;
}
.card-caption {
  font-size: 12px;
}
.card-action {
  font-size: 12px;
}
.delivery-files button {
  font-size: 12px;
}
.tiptap {
  font-size: 14px;
}
.save-status {
  color: #78869a;
}
.pane-tabs [role="tab"] {
  font-size: 12px;
  color: #69778d;
}
.composer-box textarea {
  font-size: 13px;
}
.adopt-row strong {
  font-size: 12px;
}
.adopt-row small {
  font-size: 10px;
  color: #8190a7;
}
.adopt-button,
.discard-button {
  font-size: 11px;
}
.message-by {
  font-size: 13px;
}
.message-by time {
  color: #8a95a6;
}
.learning-rule strong {
  font-size: 11px;
}
.learning-rule p {
  font-size: 10px;

}
.source-callout strong {
  font-size: 11px;
}
.source-callout p {
  font-size: 10px;
  color: #8895a8;
}
.doc-eyebrow {
  color: #7f8da4;
}
