/* Forms and dialogs share the same design language. */
.modal {
  border: 1px solid #e1e6ef;
  border-radius: 12px;
  width: min(560px, calc(100vw - 50px));
  max-height: calc(100dvh - 64px);
  padding: 0;
  box-shadow: 0 24px 80px #253b6229;
  color: var(--ink);
  background: #fff;
  overflow: hidden;
}
.modal.wide {
  width: min(890px, calc(100vw - 60px));
}
.modal::backdrop {
  background: #26344a42;
  backdrop-filter: blur(3px);
}
.modal[open] {
  display: flex;
  flex-direction: column;
}
.modal > header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 23px 27px 20px;
  border-bottom: 1px solid var(--line);
  gap: 15px;
  flex-shrink: 0;
}
.modal h2 {
  font-size: 20px;
  line-height: 1.4;
  font-weight: 600;
}
.modal > header p {
  font-size: 13px;
  color: #7b879a;
  line-height: 1.8;
  margin-top: 7px;
}
.modal-body {
  padding: 23px 27px 25px;
  overflow: auto;
  min-height: 0;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 20px;
  font-size: 13px;
  font-weight: 500;
  color: #465672;
}
.field input,
.field textarea,
.field select {
  font-weight: 400;
  font-size: 14px;
}
.form-row {
  display: flex;
  gap: 18px;
  align-items: flex-start;
}
.grow {
  flex: 1;
  min-width: 0;
}
.template-toggle {

}
.template-options {

  gap: 8px;
  flex-wrap: wrap;
  margin: -4px 0 21px;
}
.template-options button {
  border: 1px solid #d9e4f5;
  background: #f4f8ff;
  display: flex;

  border-radius: 5px;
  font-size: 12px;

.project-form fieldset {

}

  font-size: 13px;

/* Review-aligned collaboration: a goal wizard and decisions inside the artifact. */
.wizard-steps {

}

  height: 23px;
  border-radius: 50%;
  background: #eff2f7;
  font-weight: 500;
}

}

.three-modes {

.cadence-options {

.phase-summary {
