<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="grid_light" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(0, 0, 0, 0.04)" />
    </pattern>
    <marker id="arrow_light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow_gold_light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D97706" />
    </marker>
    <filter id="shadow_light" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" rx="14" fill="#F8FAFC" />
  <rect width="1000" height="580" rx="14" fill="url(#grid_light)" />
  <rect x="1" y="1" width="998" height="578" rx="13" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(24, 20)">
    <rect x="0" y="2" width="98" height="26" rx="6" fill="#FDD628" />
    <text x="49" y="19" fill="#06194A" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">DUOLAWORK</text>
    
    <text x="112" y="16" fill="#06194A" font-size="16" font-weight="700">系统拓扑 · 异构 Agent 运行时与协作架构</text>
    <text x="112" y="32" fill="#64748B" font-size="11" font-weight="500">Heterogeneous Agent Fleet · Local-First Coordination Hub · Zero-Leakage Security Boundary</text>
    
    <g transform="translate(680, 2)">
      <rect x="0" y="0" width="130" height="24" rx="12" fill="#E0E7FF" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#059669" />
      <text x="24" y="16" fill="#1E40AF" font-size="10.5" font-weight="600">Local-First Native</text>

      <rect x="138" y="0" width="134" height="24" rx="12" fill="#E0E7FF" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="150" cy="12" r="4" fill="#D97706" />
      <text x="162" y="16" fill="#1E40AF" font-size="10.5" font-weight="600">Node 24+ · SQLite</text>
    </g>
  </g>

  <!-- ================= TIER 1: CLIENT & AGENT FLEET ================= -->
  <g transform="translate(24, 68)">
    <text x="4" y="12" fill="#2563EB" font-size="11" font-weight="700" letter-spacing="1">TIER 1 · 工作台与异构执行端接入层 (WORKBENCH &amp; AGENT FLEET)</text>
  </g>

  <!-- Card 1.1: Electron Desktop -->
  <g transform="translate(24, 86)" filter="url(#shadow_light)">
    <rect width="298" height="98" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#E0E7FF" />
    <text x="26" y="31" fill="#2563EB" font-size="16" text-anchor="middle">🖥️</text>
    <text x="48" y="24" fill="#06194A" font-size="13" font-weight="700">DuolaWork 桌面工作台</text>
    <text x="48" y="38" fill="#64748B" font-size="10" font-family="monospace">Electron GUI · Port: 18766</text>
    <line x1="12" y1="48" x2="286" y2="48" stroke="#CBD5E1" stroke-width="0.75" />
    <text x="14" y="66" fill="#475569" font-size="11">群聊交互 · 双栏分屏 · 资料与任务看板</text>
    <text x="14" y="82" fill="#64748B" font-size="10.5">本地网关与适配层 (Local Gateway IPC)</text>
    <rect x="232" y="12" width="54" height="18" rx="4" fill="#E0E7FF" />
    <text x="259" y="24" fill="#1E40AF" font-size="9.5" font-weight="600" text-anchor="middle">Desktop</text>
  </g>

  <!-- Card 1.2: Coding Agents -->
  <g transform="translate(338, 86)" filter="url(#shadow_light)">
    <rect width="324" height="98" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#E0E7FF" />
    <text x="26" y="31" fill="#D97706" font-size="16" text-anchor="middle">⚡</text>
    <text x="48" y="24" fill="#06194A" font-size="13" font-weight="700">代码级 Coding Agents</text>
    <text x="48" y="38" fill="#64748B" font-size="10" font-family="monospace">Codex · Claude Code · DeepSeek</text>
    <line x1="12" y1="48" x2="312" y2="48" stroke="#CBD5E1" stroke-width="0.75" />
    <text x="14" y="66" fill="#475569" font-size="11">绑定原工作会话 · Git Workspaces 源码执行</text>
    <text x="14" y="82" fill="#64748B" font-size="10.5">原生命令环境 · 真实测试与构建反馈</text>
    <rect x="256" y="12" width="56" height="18" rx="4" fill="#E0E7FF" />
    <text x="284" y="24" fill="#1E40AF" font-size="9.5" font-weight="600" text-anchor="middle">Git / CLI</text>
  </g>

  <!-- Card 1.3: Cloud & Platform Agents -->
  <g transform="translate(678, 86)" filter="url(#shadow_light)">
    <rect width="298" height="98" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#E0E7FF" />
    <text x="26" y="31" fill="#059669" font-size="16" text-anchor="middle">🌐</text>
    <text x="48" y="24" fill="#06194A" font-size="13" font-weight="700">云端与平台 Agent</text>
    <text x="48" y="38" fill="#64748B" font-size="10" font-family="monospace">Grok · ChatGPT · Custom MCP</text>
    <line x1="12" y1="48" x2="286" y2="48" stroke="#CBD5E1" stroke-width="0.75" />
    <text x="14" y="66" fill="#475569" font-size="11">官方 Routine / Webhook / SSE 接收</text>
    <text x="14" y="82" fill="#64748B" font-size="10.5">跨平台事件驱动 · 统一协作工具集</text>
    <rect x="228" y="12" width="58" height="18" rx="4" fill="#E0E7FF" />
    <text x="257" y="24" fill="#1E40AF" font-size="9.5" font-weight="600" text-anchor="middle">Webhook</text>
  </g>

  <!-- Arrows from Tier 1 to Tier 2 -->
  <path d="M 173 184 L 173 218" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow_light)" />
  <path d="M 500 184 L 500 218" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow_light)" />
  <path d="M 827 184 L 827 218" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow_light)" />

  <!-- ================= TIER 2: COORDINATION CORE ================= -->
  <g transform="translate(24, 222)">
    <rect width="952" height="206" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    
    <rect x="12" y="10" width="310" height="22" rx="4" fill="#E0E7FF" />
    <text x="20" y="25" fill="#1E40AF" font-size="11" font-weight="700">自建协作服务核心拓扑 (HUB COORDINATION SERVICE)</text>
    <text x="332" y="25" fill="#64748B" font-size="11">Node.js 24+ / Worker · 调度总线 · 门禁校验</text>

    <!-- Submodule 1: Reactive Bus -->
    <g transform="translate(14, 40)" filter="url(#shadow_light)">
      <rect width="218" height="152" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="10" y="10" width="22" height="22" rx="4" fill="#E0E7FF" />
      <text x="21" y="26" fill="#2563EB" font-size="13" text-anchor="middle">🔄</text>
      <text x="38" y="26" fill="#06194A" font-size="12" font-weight="700">响应式事件总线</text>
      <line x1="10" y1="38" x2="208" y2="38" stroke="#CBD5E1" stroke-width="0.75" />
      <text x="12" y="56" fill="#475569" font-size="10.5">· 租约机制 (Lease Claiming)</text>
      <text x="12" y="74" fill="#475569" font-size="10.5">· 确定性唤醒 (Reactive Wakeup)</text>
      <text x="12" y="92" fill="#475569" font-size="10.5">· 零轮询流转 (No-Polling Stream)</text>
      <text x="12" y="110" fill="#475569" font-size="10.5">· 超时自动重入与故障转移</text>
      <rect x="12" y="124" width="194" height="18" rx="4" fill="#E0E7FF" />
      <text x="109" y="136" fill="#1E40AF" font-size="9" font-family="monospace" text-anchor="middle">session:event:wakeup</text>
    </g>

    <!-- Submodule 2: Task Engine -->
    <g transform="translate(244, 40)" filter="url(#shadow_light)">
      <rect width="218" height="152" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="10" y="10" width="22" height="22" rx="4" fill="#E0E7FF" />
      <text x="21" y="26" fill="#D97706" font-size="13" text-anchor="middle">📋</text>
      <text x="38" y="26" fill="#06194A" font-size="12" font-weight="700">任务跟进与协作面板</text>
      <line x1="10" y1="38" x2="208" y2="38" stroke="#CBD5E1" stroke-width="0.75" />
      <text x="12" y="56" fill="#475569" font-size="10.5">· 需求明确登记 (Coordinate)</text>
      <text x="12" y="74" fill="#475569" font-size="10.5">· 任务可另存到右侧跟进</text>
      <text x="12" y="92" fill="#475569" font-size="10.5">· 状态机 (todo→doing→done)</text>
      <text x="12" y="110" fill="#475569" font-size="10.5">· 独立验收核验 (Check / Verdict)</text>
      <rect x="12" y="124" width="194" height="18" rx="4" fill="#E0E7FF" />
      <text x="109" y="136" fill="#1E40AF" font-size="9" font-family="monospace" text-anchor="middle">board_task · consensus</text>
    </g>

    <!-- Submodule 3: Handoff Gate -->
    <g transform="translate(474, 40)" filter="url(#shadow_light)">
      <rect width="232" height="152" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
      <rect x="10" y="10" width="22" height="22" rx="4" fill="#E0E7FF" />
      <text x="21" y="26" fill="#059669" font-size="13" text-anchor="middle">🛡️</text>
      <text x="38" y="26" fill="#06194A" font-size="12" font-weight="700">交接强校验门禁</text>
      <line x1="10" y1="38" x2="222" y2="38" stroke="#CBD5E1" stroke-width="0.75" />
      <text x="12" y="56" fill="#475569" font-size="10.5">· 交接绑定具体代码提交</text>
      <text x="12" y="74" fill="#475569" font-size="10.5">· 声明跑检查时校验 checkedCommit</text>
      <text x="12" y="92" fill="#DC2626" font-size="10.5" font-weight="600">· 提交不一致 409 拒收</text>
      <text x="12" y="110" fill="#475569" font-size="10.5">· Hub 不伪造或冒充通过</text>
      <rect x="12" y="124" width="208" height="18" rx="4" fill="#E0E7FF" />
      <text x="116" y="136" fill="#059669" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">checkedCommit === commit</text>
    </g>

    <!-- Submodule 4: Vault Sandbox -->
    <g transform="translate(718, 40)" filter="url(#shadow_light)">
      <rect width="220" height="152" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4,2" />
      <rect x="10" y="10" width="22" height="22" rx="4" fill="#E0E7FF" />
      <text x="21" y="26" fill="#D97706" font-size="13" text-anchor="middle">🔐</text>
      <text x="38" y="26" fill="#06194A" font-size="12" font-weight="700">凭证隔离保险箱</text>
      <line x1="10" y1="38" x2="210" y2="38" stroke="#CBD5E1" stroke-width="0.75" />
      <text x="12" y="56" fill="#475569" font-size="10.5">· 密钥安全注入 (vault://ref)</text>
      <text x="12" y="74" fill="#475569" font-size="10.5">· 环境变量遮盖 (0 Log Leak)</text>
      <text x="12" y="92" fill="#475569" font-size="10.5">· 连接器范围白名单授权</text>
      <text x="12" y="110" fill="#475569" font-size="10.5">· 零明文透出与加密隔离</text>
      <rect x="12" y="124" width="196" height="18" rx="4" fill="#E0E7FF" />
      <text x="110" y="136" fill="#D97706" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">Zero-Leakage Boundary</text>
    </g>
  </g>

  <!-- ================= TIER 3: PERSISTENCE & EXTENSIONS ================= -->
  <g transform="translate(24, 442)">
    <text x="4" y="12" fill="#2563EB" font-size="11" font-weight="700" letter-spacing="1">TIER 3 · 本地优先持久化与生态扩展 (LOCAL-FIRST PERSISTENCE &amp; EXTENSIONS)</text>
  </g>

  <!-- Box 3.1: SQLite Database -->
  <g transform="translate(24, 460)" filter="url(#shadow_light)">
    <rect width="298" height="96" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="24" fill="#06194A" font-size="12" font-weight="700">💾 自建协作数据存储 (SQLite / D1)</text>
    <text x="14" y="42" fill="#475569" font-size="10.5">· 全量群聊事件流 (Channel Messages)</text>
    <text x="14" y="58" fill="#475569" font-size="10.5">· 任务节点与依赖关系 (Board Tasks &amp; States)</text>
    <text x="14" y="74" fill="#475569" font-size="10.5">· 长期共享记忆与决策经历 (Topic Memories)</text>
    <rect x="220" y="12" width="66" height="16" rx="3" fill="#E0E7FF" />
    <text x="253" y="23" fill="#1E40AF" font-size="8.5" font-weight="600" text-anchor="middle">State Store</text>
  </g>

  <!-- Box 3.2: Content-Addressed Materials & Git -->
  <g transform="translate(338, 460)" filter="url(#shadow_light)">
    <rect width="324" height="96" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="24" fill="#06194A" font-size="12" font-weight="700">📁 资料对象树与本地 Git 代码库</text>
    <text x="14" y="42" fill="#475569" font-size="10.5">· 共享文档修订链 (Document Revisions)</text>
    <text x="14" y="58" fill="#475569" font-size="10.5">· 分块哈希对象库 (File Chunks · SHA-256)</text>
    <text x="14" y="74" fill="#475569" font-size="10.5">· 本地工作区仓库 (Workspaces &amp; Git Trees)</text>
    <rect x="238" y="12" width="74" height="16" rx="3" fill="#E0E7FF" />
    <text x="275" y="23" fill="#1E40AF" font-size="8.5" font-weight="600" text-anchor="middle">CAS &amp; Git</text>
  </g>

  <!-- Box 3.3: External Connectors -->
  <g transform="translate(678, 460)" filter="url(#shadow_light)">
    <rect width="298" height="96" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="24" fill="#06194A" font-size="12" font-weight="700">🔗 团队共享连接器生态 (Connectors)</text>
    <text x="14" y="42" fill="#475569" font-size="10.5">· GitHub 仓库 / PR / Issue 自动化</text>
    <text x="14" y="58" fill="#475569" font-size="10.5">· Cloudflare / 飞书 / 微信公众号服务</text>
    <text x="14" y="74" fill="#475569" font-size="10.5">· 统一工具目录与权限反向代理</text>
    <rect x="226" y="12" width="60" height="16" rx="3" fill="#E0E7FF" />
    <text x="256" y="23" fill="#1E40AF" font-size="8.5" font-weight="600" text-anchor="middle">Bridges</text>
  </g>

  <!-- Connectors between Tier 2 and Tier 3 -->
  <path d="M 173 428 L 173 460" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,3" />
  <path d="M 500 428 L 500 460" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,3" />
  <path d="M 827 428 L 827 460" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,3" />
</svg>