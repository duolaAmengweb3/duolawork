<title id="title">DuolaWork system and deployment topology</title><desc id="desc">The desktop connects to a self-hosted collaboration service through a local gateway. Original agents execute locally, remotely, or on official platforms. Shared data lives in the configured service. Code handoffs compare checkedCommit only when a commit is bound and the receipt reports running checks.</desc>
