<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" style="font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="wf_grid_light" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(0, 0, 0, 0.04)" />
    </pattern>
    <marker id="wf_arrow_light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="wf_retry_light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <filter id="wf_shadow_light" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.07" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" rx="14" fill="#F8FAFC" />
  <rect width="1000" height="320" rx="14" fill="url(#wf_grid_light)" />
  <rect x="1" y="1" width="998" height="318" rx="13" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(24, 18)">
    <rect x="0" y="2" width="78" height="24" rx="5" fill="#FDD628" />
    <text x="39" y="18" fill="#06194A" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">PIPELINE</text>
    
    <text x="92" y="15" fill="#06194A" font-size="15" font-weight="700">DuolaWork 5 阶段确定性协作流程</text>
    <text x="92" y="30" fill="#64748B" font-size="11" font-weight="500">从交代目标到闭环交付 · 责任流转 · 409 代码防伪造拒收门禁</text>
  </g>

  <!-- ================= 5 STEPS PIPELINE ================= -->

  <!-- STEP 1 -->
  <g transform="translate(24, 62)" filter="url(#wf_shadow_light)">
    <rect width="176" height="194" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <rect x="10" y="10" width="56" height="18" rx="4" fill="#E0E7FF" />
    <text x="38" y="22" fill="#1E40AF" font-size="9" font-weight="800" text-anchor="middle">STEP 01</text>
    <text x="10" y="44" fill="#06194A" font-size="13" font-weight="700">1. 连接已有 Agent</text>
    <text x="10" y="58" fill="#64748B" font-size="10">环境就绪与身份绑定</text>
    <line x1="10" y1="66" x2="166" y2="66" stroke="#CBD5E1" stroke-width="0.75" />
    <text x="10" y="84" fill="#475569" font-size="10.5">· MCP/Webhook 接入</text>
    <text x="10" y="102" fill="#475569" font-size="10.5">· 绑定原项目与会话</text>
    <text x="10" y="120" fill="#475569" font-size="10.5">· 原生往返真实核验</text>
    <text x="10" y="138" fill="#64748B" font-size="10">不推断通用支持</text>
    <rect x="10" y="162" width="156" height="22" rx="4" fill="#E0E7FF" />
    <text x="88" y="177" fill="#1E40AF" font-size="10" font-weight="600" text-anchor="middle">就绪 Ready</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 204 159 L 216 159" stroke="#2563EB" stroke-width="2" marker-end="url(#wf_arrow_light)" />

  <!-- STEP 2 -->
  <g transform="translate(220, 62)" filter="url(#wf_shadow_light)">
    <rect width="176" height="194" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <rect x="10" y="10" width="56" height="18" rx="4" fill="#E0E7FF" />
    <text x="38" y="22" fill="#1E40AF" font-size="9" font-weight="800" text-anchor="middle">STEP 02</text>
    <text x="10" y="44" fill="#06194A" font-size="13" font-weight="700">2. 在群里交代目标</text>
    <text x="10" y="58" fill="#64748B" font-size="10">自然语言与任务结构化</text>
    <line x1="10" y1="66" x2="166" y2="66" stroke="#CBD5E1" stroke-width="0.75" />
    <text x="10" y="84" fill="#475569" font-size="10.5">· 说明问题、资料与时限</text>
    <text x="10" y="102" fill="#475569" font-size="10.5">· @指定成员 或 @全员</text>
    <text x="10" y="120" fill="#475569" font-size="10.5">· 任务可另存到右侧跟进</text>
    <text x="10" y="138" fill="#64748B" font-size="10">普通群聊不擅自立项</text>
    <rect x="10" y="162" width="156" height="22" rx="4" fill="#E0E7FF" />
    <text x="88" y="177" fill="#1E40AF" font-size="10" font-weight="600" text-anchor="middle">目标已交待 Dispatched</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 400 159 L 412 159" stroke="#2563EB" stroke-width="2" marker-end="url(#wf_arrow_light)" />

  <!-- STEP 3 -->
  <g transform="translate(416, 62)" filter="url(#wf_shadow_light)">
    <rect width="176" height="194" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <rect x="10" y="10" width="56" height="18" rx="4" fill="#E0E7FF" />
    <text x="38" y="22" fill="#1E40AF" font-size="9" font-weight="800" text-anchor="middle">STEP 03</text>
    <text x="10" y="44" fill="#06194A" font-size="13" font-weight="700">3. 讨论并实际执行</text>
    <text x="10" y="58" fill="#64748B" font-size="10">原生环境并行推进</text>
    <line x1="10" y1="66" x2="166" y2="66" stroke="#CBD5E1" stroke-width="0.75" />
    <text x="10" y="84" fill="#475569" font-size="10.5">· 原环境写代码/查资料</text>
    <text x="10" y="102" fill="#475569" font-size="10.5">· 租约维持与进度回传</text>
    <text x="10" y="120" fill="#475569" font-size="10.5">· 遇分歧群内向用户请示</text>
    <text x="10" y="138" fill="#64748B" font-size="10">不刷屏，无轮询空转</text>
    <rect x="10" y="162" width="156" height="22" rx="4" fill="#E0E7FF" />
    <text x="88" y="177" fill="#1E40AF" font-size="10" font-weight="600" text-anchor="middle">执行中 Doing</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 596 159 L 608 159" stroke="#2563EB" stroke-width="2" marker-end="url(#wf_arrow_light)" />

  <!-- STEP 4: GATEWAY (EMPHASIZED) -->
  <g transform="translate(612, 62)" filter="url(#wf_shadow_light)">
    <rect width="176" height="194" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8" />
    <rect x="10" y="10" width="78" height="18" rx="4" fill="#D1FAE5" />
    <text x="49" y="22" fill="#065F46" font-size="9" font-weight="800" text-anchor="middle">STEP 04 · GATE</text>
    <text x="10" y="44" fill="#06194A" font-size="13" font-weight="700">4. 成果确定性交接</text>
    <text x="10" y="58" fill="#059669" font-size="10" font-weight="600">409 防伪造强校验</text>
    <line x1="10" y1="66" x2="166" y2="66" stroke="#059669" stroke-width="0.75" />
    <text x="10" y="84" fill="#475569" font-size="10.5">· 交接绑定代码提交</text>
    <text x="10" y="102" fill="#475569" font-size="10.5">· 声明检查时核对Commit</text>
    <text x="10" y="120" fill="#DC2626" font-size="10.5" font-weight="600">· 提交不一致 409 拒收</text>
    <text x="10" y="138" fill="#64748B" font-size="10">Hub 不代跑、不伪造核验</text>
    <rect x="10" y="162" width="156" height="22" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1" />
    <text x="88" y="177" fill="#065F46" font-size="10" font-weight="700" text-anchor="middle">🛡️ 409 提交防伪校验通过</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 792 159 L 804 159" stroke="#2563EB" stroke-width="2" marker-end="url(#wf_arrow_light)" />

  <!-- STEP 5 -->
  <g transform="translate(808, 62)" filter="url(#wf_shadow_light)">
    <rect width="168" height="194" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <rect x="10" y="10" width="56" height="18" rx="4" fill="#E0E7FF" />
    <text x="38" y="22" fill="#1E40AF" font-size="9" font-weight="800" text-anchor="middle">STEP 05</text>
    <text x="10" y="44" fill="#06194A" font-size="13" font-weight="700">5. 审阅交付与沉淀</text>
    <text x="10" y="58" fill="#64748B" font-size="10">文档版本与知识归档</text>
    <line x1="10" y1="66" x2="158" y2="66" stroke="#CBD5E1" stroke-width="0.75" />
    <text x="10" y="84" fill="#475569" font-size="10.5">· 共享文稿多版本对比</text>
    <text x="10" y="102" fill="#475569" font-size="10.5">· 用户一键查验成果</text>
    <text x="10" y="120" fill="#475569" font-size="10.5">· 结构化群记忆沉淀</text>
    <text x="10" y="138" fill="#64748B" font-size="10">方法与教训自动归档</text>
    <rect x="10" y="162" width="148" height="22" rx="4" fill="#E0E7FF" />
    <text x="84" y="177" fill="#1E40AF" font-size="10" font-weight="600" text-anchor="middle">📦 交付完成 Done</text>
  </g>

  <!-- Feedback Curved Loop from Step 4 back to Step 3 -->
  <path d="M 700 256 C 700 286, 504 286, 504 260" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#wf_retry_light)" />
  <rect x="546" y="274" width="112" height="16" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.75" />
  <text x="602" y="285" fill="#DC2626" font-size="9" font-weight="700" text-anchor="middle">409 驳回 · 修复重提</text>

  <!-- Bottom Pillars Footnote -->
  <g transform="translate(24, 298)">
    <text x="0" y="10" fill="#64748B" font-size="10">核心保障机制：</text>
    <text x="70" y="10" fill="#2563EB" font-size="10" font-weight="600">[租约隔离]</text>
    <text x="122" y="10" fill="#475569" font-size="10">唯一 Attempt 租约杜绝并发冲突；</text>
    <text x="300" y="10" fill="#D97706" font-size="10" font-weight="600">[保险箱]</text>
    <text x="344" y="10" fill="#475569" font-size="10">Vault 凭证服务端代理注入，零密钥泄露；</text>
    <text x="560" y="10" fill="#059669" font-size="10" font-weight="600">[交接门禁]</text>
    <text x="618" y="10" fill="#475569" font-size="10">声明检查时强核对 checkedCommit，杜绝口头完成</text>
  </g>
</svg>