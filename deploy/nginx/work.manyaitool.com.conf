# Nginx SNI Virtual Host for DuolaWork 2.0 Cloud Control Plane
# Shares existing :80/:443 Nginx cleanly alongside duolabase.manyaitool.com without touching :5565.
limit_req_zone $binary_remote_addr zone=dw2_auth_redeem:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DUOLAWORK_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/duolawork/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DUOLAWORK_DOMAIN__;

    ssl_certificate __DUOLAWORK_CERTIFICATE__;
    ssl_certificate_key __DUOLAWORK_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 55m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Rate-limited Authentication & Short-Code Redemption Endpoints
    location ~ ^/api/v2/(auth/login|auth/magic-login|nodes/pair)$ {
        limit_req zone=dw2_auth_redeem burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Outbound Execution Node WebSocket Endpoint
    location = /api/v2/nodes/ws {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE Realtime Stream & REST API + Static Web UI
    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
